{% extends "base.html" %}
{% block content %}
<div class="stats-grid">
    <div class="stat-card teal">
        <h3 data-i18n="voters">Voters</h3>
        <div class="val" id="statVoters">250</div>
    </div>
    <div class="stat-card blue">
        <h3 data-i18n="voted">Votes Cast</h3>
        <div class="val" id="statVoted">0</div>
    </div>
</div>

<h1 style="margin-bottom: 1.5rem; color: #334155;"><span data-i18n="welcome">Welcome</span>, <span id="uiName">User</span> 👋</h1>

<div class="section-card">
    <div class="section-title">
        <h2 data-i18n="home">Dashboard Summary</h2>
        <p style="color: #666; font-size: 0.85rem;">Live election overview</p>
    </div>
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 2rem;">
        <div>
            <h4 style="margin-bottom: 1rem; color: #334155;" data-i18n="status">Status Check</h4>
            <p id="uiEligibility" style="font-weight: 700; font-size: 1.2rem;"></p>
            <p style="color: #666; margin-top: 0.5rem;"><span data-i18n="location">Location</span>: <span id="uiLocation"></span></p>
        </div>
        <div>
            <h4 style="margin-bottom: 1rem; color: #334155;">Voter Checklist</h4>
            <ul style="list-style: none; font-size: 0.9rem; color: #444;">
                <li style="margin-bottom: 0.5rem;">✅ Eligibility verified</li>
                <li style="margin-bottom: 0.5rem;">⏳ Voter ID Registration</li>
                <li style="margin-bottom: 0.5rem;">⏳ Polling Booth Found</li>
            </ul>
        </div>
    </div>
</div>

<script>
    window.addEventListener('load', () => {
        if(user) {
            renderLocal();
            fetchStats();
        }
    });

    window.addEventListener('languageChanged', renderLocal);

    function renderLocal() {
        const lang = localStorage.getItem('lang') || 'English';
        const dict = translations[lang] || translations["English"];

        document.getElementById('uiName').innerText = user.name;
        document.getElementById('uiLocation').innerText = user.state;
        const elig = document.getElementById('uiEligibility');
        if(user.age >= 18) {
            elig.innerText = dict["eligible"] || "Eligible to Vote";
            elig.style.color = "#28a745";
        } else {
            elig.innerText = dict["not_eligible"] || "Not Eligible";
            elig.style.color = "#dc3545";
        }
    }
    async function fetchStats() {
        const res = await fetch('/api/stats');
        const data = await res.json();
        document.getElementById('statVoted').innerText = data.total_votes;
        document.getElementById('statVoters').innerText = data.total_voters;
    }
</script>
{% endblock %}
