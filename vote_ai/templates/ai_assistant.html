{% extends "base.html" %}
{% block head %}
<style>
    .chat-container { height: 450px; overflow-y: auto; background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 1.5rem; margin-bottom: 1rem; display: flex; flex-direction: column; gap: 1rem; }
    .msg-wrapper { display: flex; flex-direction: column; max-width: 80%; }
    .msg { padding: 0.75rem 1rem; border-radius: 8px; font-size: 0.95rem; line-height: 1.5; position: relative; }
    .msg.bot { background: #f1f5f9; color: #334155; align-self: flex-start; border: 1px solid #e2e8f0; }
    .msg.user { background: var(--primary-blue); color: white; align-self: flex-end; }
    .voice-btn { cursor: pointer; font-size: 1rem; color: var(--primary-blue); margin-top: 5px; align-self: flex-start; }
</style>
{% endblock %}

{% block content %}
<div class="section-card">
    <div class="section-title">
        <h2>🤖 AI Election Assistant</h2>
        <p style="color: #666; font-size: 0.85rem;">Ask anything about the voting process</p>
    </div>
    <div class="chat-container" id="chat">
        <div class="msg-wrapper">
            <div class="msg bot">Hello! I am your AI assistant. How can I help you today?</div>
        </div>
    </div>
    <div style="display: flex; gap: 0.5rem;">
        <input type="text" id="userInput" class="input-field" placeholder="Type your query..." onkeypress="handleKeyPress(event)" style="margin-bottom: 0;">
        <button class="btn-primary" onclick="sendMessage()">Send</button>
    </div>
</div>

<script>
    async function sendMessage() {
        const input = document.getElementById('userInput');
        const msg = input.value.trim();
        if(!msg) return;
        appendMsg('user', msg);
        input.value = '';
        
        const typing = appendMsg('bot', 'Thinking...');
        const lang = localStorage.getItem('lang') || 'English';
        
        try {
            const res = await fetch(`/ask?q=${encodeURIComponent(msg)}&lang=${lang}`);
            const data = await res.json();
            typing.innerHTML = data.message;
            addVoiceBtn(typing, data.message);
        } catch(e) { typing.innerHTML = "⚠️ Service unavailable."; }
    }

    function appendMsg(sender, text) {
        const wrapper = document.createElement('div');
        wrapper.className = 'msg-wrapper';
        if(sender === 'user') wrapper.style.alignSelf = 'flex-end';
        const div = document.createElement('div');
        div.className = `msg ${sender}`;
        div.innerHTML = text;
        wrapper.appendChild(div);
        const chat = document.getElementById('chat');
        chat.appendChild(wrapper);
        chat.scrollTop = chat.scrollHeight;
        return div;
    }

    function addVoiceBtn(msgDiv, text) {
        const btn = document.createElement('div');
        btn.className = 'voice-btn';
        btn.innerHTML = '🔊 Speak';
        btn.onclick = () => {
            const utterance = new SpeechSynthesisUtterance(text.replace(/<[^>]*>?/gm, ''));
            const langMap = { "English": "en-IN", "Hindi": "hi-IN", "Marathi": "mr-IN", "Bengali": "bn-IN" };
            utterance.lang = langMap[localStorage.getItem('lang')] || "en-IN";
            window.speechSynthesis.speak(utterance);
        };
        msgDiv.parentNode.appendChild(btn);
    }
    function handleKeyPress(e) { if(e.key === 'Enter') sendMessage(); }
</script>
{% endblock %}
