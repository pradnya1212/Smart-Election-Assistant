<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CivicMate AI Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #0f172a;
            --bg-card: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --success: #22c55e;
            --danger: #ef4444;
            --border: #334155;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-main); display: flex; min-height: 100vh; }

        /* --- Layout --- */
        .sidebar {
            width: 320px; background-color: var(--bg-card);
            border-right: 1px solid var(--border); padding: 2rem;
            display: flex; flex-direction: column; gap: 2rem;
        }
        .main { flex: 1; display: flex; flex-direction: column; height: 100vh; }

        /* --- Profile & Tasks --- */
        .profile-card {
            background: rgba(59, 130, 246, 0.1); border: 1px solid rgba(59, 130, 246, 0.2);
            padding: 1.5rem; border-radius: 12px;
        }
        .task-list { list-style: none; display: flex; flex-direction: column; gap: 1rem; }
        .task-item {
            display: flex; align-items: center; gap: 0.75rem; padding: 1rem;
            background: rgba(255,255,255,0.03); border-radius: 8px; border: 1px solid var(--border);
            transition: 0.2s;
        }
        .task-item.completed { border-color: var(--success); background: rgba(34, 197, 94, 0.05); }
        .task-item.failed { border-color: var(--danger); background: rgba(239, 68, 68, 0.05); }

        /* --- Buttons & Inputs --- */
        .btn {
            background: var(--accent); color: white; border: none;
            padding: 0.75rem 1.5rem; border-radius: 8px; cursor: pointer;
            font-weight: 500; transition: 0.2s; width: 100%;
        }
        .btn:hover { background: var(--accent-hover); }
        .input-field {
            width: 100%; padding: 0.75rem 1rem; background: var(--bg-main);
            border: 1px solid var(--border); color: white; border-radius: 8px;
            margin-bottom: 1rem; outline: none;
        }
        .input-field:focus { border-color: var(--accent); }

        /* --- Chat UI --- */
        .chat-container {
            flex: 1; padding: 2rem; overflow-y: auto; display: flex;
            flex-direction: column; gap: 1.5rem; scroll-behavior: smooth;
        }
        .chat-container::before { content: ""; flex: 1 1 auto; }
        .msg-wrapper { display: flex; width: 100%; flex-shrink: 0; }
        .msg-wrapper.user { justify-content: flex-end; }
        .msg { max-width: 80%; padding: 1rem 1.25rem; border-radius: 12px; line-height: 1.5; }
        .msg.bot { background: var(--bg-card); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
        .msg.user { background: var(--accent); color: white; border-bottom-right-radius: 4px; }
        .input-area { padding: 1.5rem 2rem; background: var(--bg-card); border-top: 1px solid var(--border); display: flex; gap: 1rem; }

        /* --- Modals --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); backdrop-filter: blur(4px);
            display: flex; align-items: center; justify-content: center; z-index: 1000;
        }
        .modal {
            background: var(--bg-card); padding: 2.5rem; border-radius: 16px;
            width: 90%; max-width: 400px; border: 1px solid var(--border);
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <!-- Onboarding Modal -->
    <div id="onboardingModal" class="modal-overlay">
        <div class="modal">
            <h2 style="margin-bottom: 1.5rem; text-align: center;">🚀 Welcome to VoteAssist Pro</h2>
            <p style="color: var(--text-muted); margin-bottom: 1.5rem; text-align: center; font-size: 0.9rem;">
                Your personalized election companion.
            </p>
            <input type="text" id="obName" class="input-field" placeholder="Full Name">
            <input type="number" id="obAge" class="input-field" placeholder="Age">
            <input type="text" id="obState" class="input-field" placeholder="State (e.g. Maharashtra)">
            <input type="text" id="obDistrict" class="input-field" placeholder="District (e.g. Mumbai)">
            <button class="btn" onclick="saveUser()">Start Dashboard</button>
        </div>
    </div>

    <!-- Simulator Modal -->
    <div id="simModal" class="modal-overlay hidden">
        <div class="modal">
            <h2 style="margin-bottom: 1.5rem;">🆔 Register Voter ID</h2>
            <input type="text" id="simAddress" class="input-field" placeholder="Full Residential Address">
            <div style="display: flex; gap: 1rem;">
                <button class="btn" style="background: transparent; border: 1px solid var(--border);" onclick="closeSim()">Cancel</button>
                <button class="btn" onclick="submitSim()">Submit</button>
            </div>
        </div>
    </div>

    <!-- LEFT SIDEBAR -->
    <nav class="sidebar" aria-label="Dashboard">
        <h2 style="font-weight: 700; letter-spacing: -0.5px; display: flex; align-items: center; gap: 0.5rem;">
            🗳️ CivicMate <span style="color: var(--accent);">AI</span>
        </h2>
        
        <!-- Native AI Language Selector -->
        <div class="input-group" style="margin-bottom: 1.5rem;">
            <label style="color: var(--text-muted); font-size: 0.8rem; text-transform: uppercase;">🌐 AI Language</label>
            <select id="appLang" class="input-field" style="margin-bottom: 0;">
                <option value="English">🇬🇧 English</option>
                <option value="Hindi">🇮🇳 Hindi</option>
                <option value="Marathi">🇮🇳 Marathi</option>
                <option value="Bengali">🇮🇳 Bengali</option>
            </select>
        </div>

        <div class="profile-card" id="profileCard">
            <h3 style="margin-bottom: 0.5rem;">Hello <span id="uiName"></span> 👋</h3>
            <p id="uiEligibility" style="font-weight: 600; margin-bottom: 0.5rem;"></p>
            <p style="color: var(--text-muted); font-size: 0.85rem;">📍 <span id="uiDistrict"></span>, <span id="uiState"></span></p>
        </div>
        <div>
            <h4 style="color: var(--text-muted); margin-bottom: 1rem; text-transform: uppercase; font-size: 0.8rem; letter-spacing: 1px;">📋 Your Task Tracker</h4>
            <ul class="task-list" id="taskList">
                <li class="task-item" id="task1"><span>⏳</span> Check Eligibility</li>
                <li class="task-item" id="task2"><span>⏳</span> Register Voter ID</li>
                <li class="task-item" id="task3"><span>⏳</span> Find Booth Location</li>
                <li class="task-item" id="task4"><span>⏳</span> Cast Vote</li>
            </ul>
        </div>
        <div style="margin-top: auto; display: flex; flex-direction: column; gap: 0.75rem;">
            <button class="btn" style="background: var(--success); font-weight: 700;" onclick="window.location.href='/voting'">🗳️ Live Voting System</button>
            <button class="btn" onclick="openSim()">Register Voter ID</button>
            <button class="btn" style="background: transparent; border: 1px solid var(--border);" onclick="quickAsk('Find my polling booth')">Find Booth</button>
            <button class="btn" style="background: transparent; color: var(--danger);" onclick="resetProfile()">Reset Profile</button>
        </div>
    </nav>

    <!-- RIGHT MAIN CHAT -->
    <main class="main">
        <div class="chat-container" id="chat" role="log" aria-live="polite"></div>
        <div class="input-area">
            <input type="text" id="userInput" class="input-field" style="margin: 0;" placeholder="Ask anything..." aria-label="Ask a question" onkeypress="handleKeyPress(event)">
            <button class="btn" style="width: auto;" onclick="sendMessage()">Send</button>
        </div>
    </main>

    <script>
        let user = null;
        window.onload = () => {
            const saved = localStorage.getItem("user");
            if (!saved) {
                window.location.href = "/";
                return;
            }
            user = JSON.parse(saved);
            document.getElementById('onboardingModal').classList.add('hidden');
            updateDashboard();
            appendMessage('bot', `Welcome back, ${user.name}! I am CivicMate AI. How can I assist you with your elections today?`);
        };

        function saveUser() {
            const name = document.getElementById('obName').value;
            const age = document.getElementById('obAge').value;
            const state = document.getElementById('obState').value;
            const district = document.getElementById('obDistrict').value;
            if(!name || !age || !state || !district) return alert("Please fill all fields!");
            user = { name, age: parseInt(age), state, district, registered: false };
            localStorage.setItem("user", JSON.stringify(user));
            document.getElementById('onboardingModal').classList.add('hidden');
            updateDashboard();
            appendMessage('bot', `Hello ${user.name}! 👋 I've set up your personalized dashboard for ${user.district}, ${user.state}. Let's get you ready for the elections!`);
            checkEligibility();
        }

        function resetProfile() { localStorage.removeItem("user"); location.reload(); }

        function updateDashboard() {
            document.getElementById('uiName').innerText = user.name;
            document.getElementById('uiDistrict').innerText = user.district;
            document.getElementById('uiState').innerText = user.state;
            
            if(user.age >= 18) {
                document.getElementById('uiEligibility').innerText = "✔ Eligible to Vote";
                document.getElementById('uiEligibility').style.color = "var(--success)";
                updateTask(1, 'completed', '✔', 'Eligibility Confirmed');
            } else {
                document.getElementById('uiEligibility').innerText = "❌ Not Eligible (Under 18)";
                document.getElementById('uiEligibility').style.color = "var(--danger)";
                updateTask(1, 'failed', '❌', 'Eligibility Failed (Under 18)');
            }
            if(user.registered) updateTask(2, 'completed', '✔', 'Voter ID Registered');
        }

        function updateTask(id, statusClass, icon, text) {
            const el = document.getElementById('task' + id);
            el.className = 'task-item ' + statusClass;
            el.innerHTML = `<span>${icon}</span> ${text}`;
        }

        async function checkEligibility() {
            appendMessage('user', `Check my eligibility for age ${user.age}`);
            const res = await fetch(`/check?age=${user.age}`);
            const data = await res.json();
            appendMessage('bot', data.result);
        }

        function quickAsk(q) { document.getElementById('userInput').value = q; sendMessage(); }

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const msg = input.value.trim();
            if(!msg) return;
            appendMessage('user', msg);
            input.value = '';

            // Interactive Task Overrides
            if (msg.toLowerCase().includes("find") && msg.toLowerCase().includes("booth")) {
                setTimeout(() => {
                    appendMessage('bot', `📍 **Booth Search for ${user.district}:**\nBased on your profile, I am analyzing booths in ${user.district}, ${user.state}.\n\nCheck official locations here: [Electoral Search](https://electoralsearch.eci.gov.in/)`);
                    updateTask(3, 'completed', '✔', 'Booth Location Found');
                }, 800);
                return;
            }
            if (msg.toLowerCase().includes("vote") && msg.toLowerCase().includes("cast")) {
                setTimeout(() => {
                    appendMessage('bot', `🎉 **Congratulations!**\nYou have completed the final step. Thank you for participating in democracy!`);
                    updateTask(4, 'completed', '✔', 'Vote Casted Successfully');
                }, 800);
                return;
            }

            const lang = document.getElementById('appLang').value;
            const typing = appendMessage('bot', 'Thinking...');
            try {
                const res = await fetch(`/ask?q=${encodeURIComponent(msg)}&lang=${encodeURIComponent(lang)}`);
                const data = await res.json();
                typing.innerHTML = formatMarkdown(data.message);
            } catch {
                typing.innerHTML = "⚠️ Offline mode active. Please check connection.";
            }
        }

        function formatMarkdown(text) {
            if (typeof text === 'string') {
                text = text.replace(/\*\*(.*?)\*\*/g, "<b>$1</b>");
                text = text.replace(/\n/g, "<br>");
                return text;
            }
            return text;
        }

        function appendMessage(sender, text) {
            const wrapper = document.createElement("div");
            wrapper.className = `msg-wrapper ${sender}`;
            const msgObj = document.createElement("div");
            msgObj.className = `msg ${sender}`;
            msgObj.innerHTML = formatMarkdown(text);
            
            // Add Voice Button for bot messages
            if(sender === 'bot') {
                const voiceBtn = document.createElement("button");
                voiceBtn.innerHTML = "🔊";
                voiceBtn.style.cssText = "background:transparent; border:none; cursor:pointer; margin-left:10px; font-size:1.2rem; align-self:flex-start; margin-top:10px;";
                voiceBtn.onclick = () => {
                    const speech = new SpeechSynthesisUtterance(text.replace(/\*\*/g, "").replace(/<br>/g, " "));
                    
                    // Assign correct voice accent based on language
                    const langMap = { "English": "en-IN", "Hindi": "hi-IN", "Marathi": "mr-IN", "Bengali": "bn-IN" };
                    speech.lang = langMap[document.getElementById('appLang').value] || "en-IN";
                    
                    window.speechSynthesis.speak(speech);
                };
                wrapper.appendChild(msgObj);
                wrapper.appendChild(voiceBtn);
            } else {
                wrapper.appendChild(msgObj);
            }

            document.getElementById('chat').appendChild(wrapper);
            document.getElementById('chat').scrollTop = document.getElementById('chat').scrollHeight;
            return msgObj;
        }

        function handleKeyPress(e) { if(e.key === 'Enter') sendMessage(); }

        function openSim() {
            if(user && user.age < 18) return alert("You are not eligible to register yet (under 18).");
            document.getElementById('simModal').classList.remove('hidden');
        }
        function closeSim() { document.getElementById('simModal').classList.add('hidden'); }
        
        async function submitSim() {
            const addr = document.getElementById('simAddress').value;
            if(!addr) return alert("Enter address!");
            closeSim();
            appendMessage('user', `Register me for Voter ID. Name: ${user.name}, Age: ${user.age}, Address: ${addr}`);
            const typing = appendMessage('bot', 'Processing Registration...');
            const res = await fetch('/generate', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ name: user.name, age: user.age, address: addr })
            });
            const data = await res.json();
            typing.innerHTML = formatMarkdown(data.message);
            if(data.success) {
                user.registered = true;
                localStorage.setItem("user", JSON.stringify(user));
                updateDashboard();
            }
        }
    </script>
</body>
</html>
