<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CivicMate AI - Login</title>
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #1e293b; --accent: #3b82f6; --bg: #f1f5f9; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg); display: flex; align-items: center; justify-content: center; height: 100vh; }

        .login-card { background: white; padding: 2.5rem; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); width: 100%; max-width: 400px; text-align: center; }
        .logo { font-size: 1.5rem; font-weight: 800; color: var(--primary); margin-bottom: 2rem; display: flex; align-items: center; justify-content: center; gap: 0.5rem; }
        .logo span { color: var(--accent); }

        h1 { font-size: 1.25rem; margin-bottom: 0.5rem; color: #334155; }
        p { color: #64748b; font-size: 0.9rem; margin-bottom: 2rem; }

        .form-group { text-align: left; margin-bottom: 1.25rem; }
        .form-group label { display: block; font-size: 0.85rem; font-weight: 600; color: #475569; margin-bottom: 0.5rem; }
        .input-field { width: 100%; padding: 0.75rem 1rem; border: 1px solid #e2e8f0; border-radius: 8px; outline: none; transition: 0.2s; font-size: 0.95rem; }
        .input-field:focus { border-color: var(--accent); ring: 2px rgba(59, 130, 246, 0.1); }

        .btn { width: 100%; padding: 0.75rem; background: var(--primary); color: white; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; transition: 0.2s; margin-top: 1rem; }
        .btn:hover { background: #0f172a; transform: translateY(-1px); }

        .footer { margin-top: 2rem; font-size: 0.85rem; color: #94a3b8; }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="logo">🗳️ CivicMate <span>AI</span></div>
        <h1>Welcome Back</h1>
        <p>Enter your details to access the election portal</p>

        <form onsubmit="handleLogin(event)">
            <div class="form-group">
                <label>Voter Name</label>
                <input type="text" id="name" class="input-field" placeholder="Full Name" required>
            </div>
            <div class="form-group">
                <label>Voter Age</label>
                <input type="number" id="age" class="input-field" placeholder="18+" required>
            </div>
            <div class="form-group">
                <label>District / State</label>
                <input type="text" id="state" class="input-field" placeholder="Location" required>
            </div>
            <button type="submit" class="btn">Sign In</button>
        </form>

        <div class="footer">
            &copy; 2026 CivicMate AI. Secure Voting Environment.
        </div>
    </div>

    <script>
        async function handleLogin(e) {
            e.preventDefault();
            const user = {
                name: document.getElementById('name').value,
                age: document.getElementById('age').value,
                state: document.getElementById('state').value
            };

            const csrfToken = document.querySelector('meta[name="csrf-token"]').getAttribute('content');

            // Register in real DB
            await fetch('/generate', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': csrfToken
                },
                body: JSON.stringify({
                    name: user.name,
                    age: user.age,
                    address: user.state,
                    lang: 'English'
                })
            });

            localStorage.setItem("user", JSON.stringify(user));
            window.location.href = "/dashboard";
        }
    </script>
</body>
</html>
