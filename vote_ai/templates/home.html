<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CivicMate AI - Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #1e293b; --accent: #3b82f6; --bg: #f1f5f9; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg); display: flex; align-items: center; justify-content: center; height: 100vh; }
        
        .login-card { background: white; padding: 2.5rem; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); width: 100%; max-width: 400px; text-align: center; }
        .logo { font-size: 1.5rem; font-weight: 800; color: var(--primary); margin-bottom: 2rem; display: flex; align-items: center; justify-content: center; gap: 0.5rem; }
        .logo span { color: var(--accent); }
        
        h1 { font-size: 1.25rem; margin-bottom: 0.5rem; color: #334155; }
        p { color: #64748b; font-size: 0.9rem; margin-bottom: 2rem; }
        
        .form-group { text-align: left; margin-bottom: 1.25rem; }
        .form-group label { display: block; font-size: 0.85rem; font-weight: 600; color: #475569; margin-bottom: 0.5rem; }
        .input-field { width: 100%; padding: 0.75rem 1rem; border: 1px solid #e2e8f0; border-radius: 8px; outline: none; transition: 0.2s; font-size: 0.95rem; }
        .input-field:focus { border-color: var(--accent); ring: 2px rgba(59, 130, 246, 0.1); }
        
        .btn { width: 100%; padding: 0.75rem; background: var(--primary); color: white; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; transition: 0.2s; margin-top: 1rem; }
        .btn:hover { background: #0f172a; transform: translateY(-1px); }
        
        .footer { margin-top: 2rem; font-size: 0.85rem; color: #94a3b8; }
    </style>
</head>
<body>

    <div class="login-card">
        <h2 data-i18n="login_title">Voter Identity</h2>
        <p style="text-align: center; color: #666; margin-bottom: 2rem;" data-i18n="login_sub">Official Student Election Portal</p>
        
        <form id="loginForm" onsubmit="handleLogin(event)">
            <label data-i18n="full_name">Full Name</label>
            <input type="text" id="name" class="input-field" data-i18n="ph_name" placeholder="Enter your name" required>
            
            <label data-i18n="age">Age</label>
            <input type="number" id="age" class="input-field" data-i18n="ph_age" placeholder="Enter age" required>
            
            <label data-i18n="district">District</label>
            <input type="text" id="state" class="input-field" data-i18n="ph_district" placeholder="Enter district" required>
            
            <button type="submit" class="btn" data-i18n="signin">Sign In</button>
        </form>

        <div style="margin-top: 2rem; border-top: 1px solid #eee; padding-top: 1rem;">
            <select id="loginLang" style="width: 100%; padding: 0.5rem; border-radius: 4px; border: 1px solid #ddd;" onchange="changeLang(this.value)">
                <option value="English">English</option>
                <option value="Hindi">Hindi</option>
                <option value="Marathi">Marathi</option>
                <option value="Bengali">Bengali</option>
            </select>
        </div>

        <div class="footer">
            &copy; 2026 CivicMate AI. Secure Voting Environment.
        </div>
    </div>

    <script>
        const translations = {
            "English": { "login_title": "Voter Identity", "login_sub": "Official Student Election Portal", "full_name": "Full Name", "age": "Age", "district": "District", "signin": "Sign In", "ph_name": "Enter your name", "ph_age": "Enter age", "ph_district": "Enter district" },
            "Marathi": { "login_title": "मतदार ओळख", "login_sub": "अधिकृत विद्यार्थी निवडणूक पोर्टल", "full_name": "पूर्ण नाव", "age": "वय", "district": "जिल्हा", "signin": "प्रवेश करा", "ph_name": "तुमचे नाव टाका", "ph_age": "वय टाका", "ph_district": "जिल्हा टाका" },
            "Hindi": { "login_title": "मतदाता पहचान", "login_sub": "आधिकारिक छात्र चुनाव पोर्टल", "full_name": "पूरा नाम", "age": "आयु", "district": "ज़िला", "signin": "प्रवेश करें", "ph_name": "अपना नाम दर्ज करें", "ph_age": "आयु दर्ज करें", "ph_district": "ज़िला दर्ज करें" },
            "Bengali": { "login_title": "ভোটার পরিচয়", "login_sub": "অফিসিয়াল ছাত্র নির্বাচন পোর্টাল", "full_name": "পুরো নাম", "age": "বয়স", "district": "জেলা", "signin": "প্রবেশ করুন", "ph_name": "আপনার নাম লিখুন", "ph_age": "বয়স লিখুন", "ph_district": "জেলা লিখুন" }
        };

        function changeLang(lang) {
            localStorage.setItem('lang', lang);
            const dict = translations[lang];
            document.querySelectorAll("[data-i18n]").forEach(el => {
                const key = el.getAttribute("data-i18n");
                if (dict[key]) {
                    if (el.tagName === "INPUT") el.placeholder = dict[key];
                    else el.innerText = dict[key];
                }
            });
        }

        window.onload = () => {
            const saved = localStorage.getItem('lang') || 'English';
            document.getElementById('loginLang').value = saved;
            changeLang(saved);
        };

        async function handleLogin(e) {
            e.preventDefault();
            const user = {
                name: document.getElementById('name').value,
                age: document.getElementById('age').value,
                state: document.getElementById('state').value
            };
            
            // Register in real DB
            await fetch('/api/register_voter', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    name: user.name,
                    age: user.age,
                    location: user.state
                })
            });

            localStorage.setItem("user", JSON.stringify(user));
            window.location.href = "/dashboard";
        }
    </script>
</body>
</html>
