<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CivicMate AI - Premium Voter Assistant</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --accent: #3b82f6; --text: #f8fafc; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: var(--bg); color: var(--text); display: flex; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; }
        .hero { text-align: center; max-width: 600px; padding: 2rem; z-index: 10; }
        h1 { font-size: 3.5rem; font-weight: 700; margin-bottom: 1rem; background: linear-gradient(to right, #60a5fa, #3b82f6); -webkit-background-clip: text; color: transparent; letter-spacing: -1px; }
        p { color: #94a3b8; font-size: 1.1rem; margin-bottom: 2.5rem; line-height: 1.6; }
        .card { background: var(--card); padding: 2.5rem; border-radius: 16px; border: 1px solid #334155; box-shadow: 0 20px 40px rgba(0,0,0,0.5); text-align: left; animation: slideUp 0.6s ease-out forwards; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .input-group { margin-bottom: 1.5rem; }
        label { display: block; font-size: 0.85rem; color: #94a3b8; margin-bottom: 0.5rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
        input { width: 100%; padding: 0.9rem 1rem; background: var(--bg); border: 1px solid #334155; color: white; border-radius: 8px; font-size: 1rem; outline: none; transition: 0.2s; }
        input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2); }
        .btn { width: 100%; padding: 1rem; background: var(--accent); color: white; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: 0.2s; margin-top: 1rem; display: flex; justify-content: center; align-items: center; gap: 0.5rem; }
        .btn:hover { background: #2563eb; transform: translateY(-2px); box-shadow: 0 10px 20px rgba(59,130,246,0.3); }
        .bg-glow { position: absolute; width: 800px; height: 800px; background: radial-gradient(circle, rgba(59,130,246,0.1) 0%, rgba(15,23,42,0) 60%); top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 0; pointer-events: none; }
    </style>
</head>
<body>
    <div class="bg-glow"></div>
    <div class="hero">
        <h1>CivicMate AI</h1>
        <p>Your personalized, intelligent election companion. Enter your details to generate your custom voting dashboard.</p>
        
        <div class="card">
            <div class="input-group">
                <label>Full Name</label>
                <input type="text" id="obName" placeholder="e.g., Akash Wani">
            </div>
            <div class="input-group" style="display: flex; gap: 1rem;">
                <div style="flex: 1;">
                    <label>Age</label>
                    <input type="number" id="obAge" placeholder="e.g., 22">
                </div>
                <div style="flex: 2;">
                    <label>State</label>
                    <input type="text" id="obState" placeholder="e.g., Maharashtra">
                </div>
            </div>
            <button class="btn" onclick="startApp()">Access Dashboard &rarr;</button>
        </div>
    </div>

    <script>
        // Redirect if already logged in
        if(localStorage.getItem("user")) {
            window.location.href = "/dashboard";
        }

        function startApp() {
            const name = document.getElementById('obName').value;
            const age = document.getElementById('obAge').value;
            const state = document.getElementById('obState').value;
            
            if(!name || !age || !state) return alert("Please fill all fields to continue.");
            
            let user = { 
                name: name, 
                age: parseInt(age), 
                state: state, 
                district: state, // Simplify
                registered: false 
            };
            
            localStorage.setItem("user", JSON.stringify(user));
            window.location.href = "/dashboard";
        }
    </script>
</body>
</html>
